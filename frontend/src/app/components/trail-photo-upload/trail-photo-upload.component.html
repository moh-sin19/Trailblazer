<div class="bg-white rounded-lg shadow-md p-6 space-y-4">
  <h3 class="text-xl font-bold text-gray-900">Upload Photo</h3>

  <div class="upload-container">
    <!-- File input -->
    <input
      type="file"
      accept="image/jpeg,image/png,image/webp"
      (change)="onFileSelected($event)"
      #fileInput
      class="hidden"
    />

    <!-- Upload button or preview -->
    <div *ngIf="!previewUrl" class="text-center py-8">
      <button
        type="button"
        (click)="fileInput.click()"
        class="w-full px-4 py-3 bg-bush-600 text-white rounded-md hover:bg-bush-700 transition-colors font-medium"
      >
        📷 Select Photo
      </button>
      <p class="mt-2 text-sm text-gray-500">
        JPEG, PNG, or WebP • Max 10MB
      </p>
    </div>

    <!-- Preview area -->
    <div *ngIf="previewUrl" class="space-y-4">
      <img [src]="previewUrl" alt="Photo preview" class="w-full rounded-lg shadow" />

      <!-- Caption input -->
      <div>
        <label for="caption" class="block text-sm font-medium text-gray-700 mb-1">
          Caption (optional)
        </label>
        <input
          id="caption"
          type="text"
          [(ngModel)]="caption"
          maxlength="140"
          placeholder="Add a caption..."
          class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-bush-500"
        />
        <p class="mt-1 text-xs text-gray-500">{{ caption.length }}/140 characters</p>
      </div>

      <!-- Primary photo checkbox -->
      <div class="flex items-center">
        <input
          id="isPrimary"
          type="checkbox"
          [(ngModel)]="isPrimary"
          class="h-4 w-4 text-bush-600 focus:ring-bush-500 border-gray-300 rounded"
        />
        <label for="isPrimary" class="ml-2 text-sm text-gray-700">
          Set as primary photo
        </label>
      </div>

      <!-- Upload/Cancel buttons -->
      <div class="flex gap-2">
        <button
          type="button"
          (click)="uploadPhoto()"
          [disabled]="isUploading"
          class="flex-1 px-4 py-2 bg-bush-600 text-white rounded-md hover:bg-bush-700 disabled:bg-gray-400 disabled:cursor-not-allowed transition-colors font-medium"
        >
          {{ isUploading ? '⏳ Uploading...' : '☁️ Upload Photo' }}
        </button>
        <button
          type="button"
          (click)="cancelUpload()"
          [disabled]="isUploading"
          class="flex-1 px-4 py-2 border border-gray-300 text-gray-700 rounded-md hover:bg-gray-50 disabled:opacity-50 disabled:cursor-not-allowed transition-colors font-medium"
        >
          Cancel
        </button>
      </div>
    </div>

    <!-- Error message -->
    <div *ngIf="uploadError" class="p-3 bg-red-50 border border-red-200 rounded-md">
      <p class="text-sm text-red-600">{{ uploadError }}</p>
    </div>
  </div>
</div>
