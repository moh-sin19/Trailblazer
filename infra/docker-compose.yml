services:
  db:
    image: postgis/postgis:17-3.4
    ports: ["5432:5432"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-trails}
      POSTGRES_USER: ${POSTGRES_USER:-trails}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-trails}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-trails} -d ${POSTGRES_DB:-trails}"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    env_file: ../.env
    volumes:
      - ../backend:/app
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    command: bash -lc "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"

volumes:
  pgdata:
